services:
  mysql:
    image: mysql:8.4
    container_name: dynamic-form-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dynamic_forms}
      MYSQL_USER: ${MYSQL_USER:-dynamic_forms_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_for_local_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root_for_local_dev}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${MYSQL_USER:-dynamic_forms_app} -p${MYSQL_PASSWORD:-change_me_for_local_dev} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-api
    container_name: dynamic-form-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      CI_ENVIRONMENT: development
      APP_BASE_URL: http://localhost:${BACKEND_PORT:-8080}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-dynamic_forms}
      DB_USERNAME: ${MYSQL_USER:-dynamic_forms_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change_me_for_local_dev}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
      JSON_MAX_BYTES: 1048576
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-log}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-no-reply@dynamic-forms.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Dynamic Forms}
      ADMIN_NOTIFICATION_EMAILS: ${ADMIN_NOTIFICATION_EMAILS:-}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      AUTO_SEED: ${AUTO_SEED:-false}
    ports:
      - "${BACKEND_PORT:-8080}:80"
    volumes:
      - ./backend-api:/var/www/html
      - backend-vendor:/var/www/html/vendor

  frontend:
    build:
      context: ./frontend-app
    container_name: dynamic-form-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend-app:/app
      - frontend-node-modules:/app/node_modules

volumes:
  mysql-data:
  backend-vendor:
  frontend-node-modules:
